[project]
name = "credit-monitoring"
version = "0.1.0"
description = "Qualidade, drift e observabilidade de crédito — Tech Challenge Fase 4"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas>=2.2,<3", "numpy>=2,<3", "scikit-learn>=1.6,<2",
  "pandera[pandas]>=0.24,<0.36", "evidently>=0.7,<0.8",
  "mlflow>=3,<4", "scipy>=1.14,<2", "xlrd>=2,<3",
  "matplotlib>=3.9,<4", "psutil>=6,<8",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_monitoring"]

[project.scripts]
credit-monitor = "credit_monitoring.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: verifica componentes integrados"]
